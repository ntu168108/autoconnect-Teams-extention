name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            zip: TeamsAutoJoiner-Windows.zip
          - os: macos-latest
            zip: TeamsAutoJoiner-macOS.zip
          # Bản Linux dựng trên ubuntu-22.04 (không phải -latest) để chạy được
          # trên cả các bản phân phối cũ hơn: PyInstaller nhúng glibc của máy
          # build, nên build trên bản mới sẽ không chạy trên bản cũ.
          - os: ubuntu-22.04
            zip: TeamsAutoJoiner-Linux.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build binary
        run: >
          python -m PyInstaller --onefile --console --name TeamsAutoJoiner
          --collect-submodules selenium
          --distpath dist --workpath build --specpath build src/main.py

      - name: Smoke test binary
        shell: bash
        run: ./dist/TeamsAutoJoiner* --selfcheck

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item config.json.example dist/
          Copy-Item packaging/HUONG-DAN.txt dist/
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.zip }}

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cp config.json.example packaging/HUONG-DAN.txt dist/
          cat > "dist/Chạy bot.command" <<'EOF'
          #!/bin/bash
          cd "$(dirname "$0")"
          if [ ! -w "$(pwd)" ]; then
            echo ""
            echo "[LOI] Khong co quyen ghi vao thu muc nay: $(pwd)"
            echo "      -> Chuyen ca thu muc bot ra noi co quyen ghi (Desktop"
            echo "         hoac Documents) roi chay lai."
            echo ""
            read -n 1 -s -r -p "Nhan phim bat ky de dong..."
            exit 1
          fi
          ./TeamsAutoJoiner
          echo ""
          echo "=== Bot đã dừng. Nhấn phím bất kỳ để đóng. ==="
          read -n 1 -s -r
          EOF
          chmod +x "dist/Chạy bot.command" dist/TeamsAutoJoiner
          cd dist && zip -r "../${{ matrix.zip }}" .

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cp config.json.example packaging/HUONG-DAN.txt dist/
          cat > "dist/chay-bot.sh" <<'EOF'
          #!/usr/bin/env bash
          cd "$(dirname "$0")"
          if [ ! -w "$(pwd)" ]; then
            echo ""
            echo "[LOI] Khong co quyen ghi vao thu muc nay: $(pwd)"
            echo "      -> Chuyen ca thu muc bot ra noi co quyen ghi roi chay lai,"
            echo "         hoac: chmod u+w \"$(pwd)\""
            echo ""
            read -n 1 -s -r -p "Nhan phim bat ky de dong..."
            exit 1
          fi
          ./TeamsAutoJoiner
          echo ""
          echo "=== Bot đã dừng. Nhấn phím bất kỳ để đóng. ==="
          read -n 1 -s -r
          EOF
          chmod +x dist/chay-bot.sh dist/TeamsAutoJoiner
          cd dist && zip -r "../${{ matrix.zip }}" .

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.zip }}
          generate_release_notes: true
